[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peru-inflation-nowcasting"
version = "0.1.0"
description = "Nowcasting Peruvian inflation with mixed-frequency (MIDAS) and machine learning models"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Rodrigo Grandez"}]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
